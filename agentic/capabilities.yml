version: 1
# Context budget model (see ../README.md#context-budgets)
#   always-on  : CLAUDE.md, AGENTS.md, copilot-instructions.md, Antigravity main rule. Index + commands only.
#   scoped     : one file per guideline, loaded when matching files are touched (Claude rules paths:,
#                Copilot applyTo, Antigravity trigger: glob).
#   on-demand  : one skill per guideline (Claude .claude/skills, Copilot .github/skills, Codex .agents/skills)
#                or an Antigravity trigger: model_decision rule. Only name + description are always visible.
verifiedOn: 2026-11-17
# Verified against vendor docs on this date: Claude Code (memory, skills, hooks, settings), GitHub Copilot and VS Code
# (custom agents, skills, instructions, prompt files, hooks), OpenAI Codex (AGENTS.md, skills, plugins, config),
# Google Antigravity (rules, skills, workflows).
assistants:
  claude-code:
    displayName: Claude Code
    surfaces:
      - id: main-instructions
        output: CLAUDE.md
        minLevel: basic
        stability: stable
        risk: passive
        docsUrl: https://docs.claude.com/en/docs/claude-code/memory
        limit: Keep the main file concise and reference detailed project files.
      - id: workflow-commands
        output: .claude/commands/*.md
        minLevel: standard
        stability: stable
        risk: guided
        docsUrl: https://docs.claude.com/en/docs/claude-code/slash-commands
        limit: Commands are reusable prompts, not enforcement.
      - id: subagents
        output: .claude/agents/*.md
        minLevel: full
        stability: stable
        risk: agentic
        docsUrl: https://docs.claude.com/en/docs/claude-code/sub-agents
        limit: Keep each subagent focused on one review job.
      - id: skills
        output: .claude/skills/*/SKILL.md
        minLevel: full
        stability: stable
        risk: agentic
        docsUrl: https://docs.claude.com/en/docs/claude-code/skills
        limit: Use progressive disclosure for larger references.
      - id: hooks
        output: .claude/settings.json
        minLevel: full
        stability: stable
        risk: side-effecting
        docsUrl: https://docs.anthropic.com/en/docs/claude-code/hooks
        limit: Hooks execute shell commands automatically. Do not use hooks to run full test suites; use /check for validation.

  copilot:
    displayName: GitHub Copilot
    surfaces:
      - id: main-instructions
        output: .github/copilot-instructions.md
        minLevel: basic
        stability: stable
        risk: passive
        docsUrl: https://docs.github.com/en/copilot/concepts/prompting/response-customization
        limit: Keep repository instructions concise.
      - id: scoped-instructions
        output: .github/instructions/*.instructions.md
        minLevel: basic
        stability: stable
        risk: passive
        docsUrl: https://docs.github.com/en/copilot/concepts/prompting/response-customization
        limit: Use applyTo globs for relevance.
      - id: workflow-commands
        output: .github/instructions/workflows.instructions.md
        minLevel: standard
        stability: stable
        risk: guided
        docsUrl: https://docs.github.com/en/copilot/concepts/prompting/response-customization
        limit: Workflow instructions are context, not guaranteed enforcement.
      - id: prompt-files
        output: .github/prompts/*.prompt.md
        minLevel: standard
        stability: stable
        risk: guided
        docsUrl: https://code.visualstudio.com/docs/copilot/copilot-customization
        limit: VS Code documents prompt files as running only in the Local harness, which it plans to remove by February 2027; the docs recommend skills for reusable tasks.
      - id: custom-agents
        output: .github/agents/*.agent.md
        minLevel: full
        stability: stable
        risk: agentic
        docsUrl: https://docs.github.com/en/copilot/reference/custom-agents-configuration
        limit: Chat modes (.chatmode.md) were renamed to custom agents (.agent.md). A description is required; the prompt is limited to 30,000 characters. Generated reviewer agents are read-only (tools read, search).
      - id: guideline-skills
        output: .github/skills/aicgen-*/SKILL.md
        minLevel: basic
        stability: stable
        risk: passive
        docsUrl: https://code.visualstudio.com/docs/copilot/customization/agent-skills
        limit: Skill name must match its folder, lowercase letters, digits and hyphens, at most 64 characters; description at most 1024 characters.
      - id: mcp-templates
        output: .aicgen/mcp/copilot.md
        minLevel: full
        stability: preview
        risk: side-effecting
        docsUrl: https://docs.github.com/en/copilot/how-tos/provide-context/use-mcp/extend-copilot-chat-with-mcp
        limit: AICGEN emits documentation templates only.

  antigravity:
    displayName: Antigravity
    surfaces:
      - id: main-instructions
        output: .agents/rules/aicgen-instructions.md
        minLevel: basic
        stability: stable
        risk: passive
        docsUrl: https://antigravity.google/docs/rules.md
        limit: Rule files need `trigger` frontmatter or they are silently discarded. 24,000 bytes per file; 20,000-token budget for always-on rules.
      - id: workflow-commands
        output: .agents/workflows/*.md
        minLevel: standard
        stability: stable
        risk: guided
        docsUrl: https://antigravity.google/docs/rules.md
        limit: Antigravity documents workflows as deprecated in favour of skills; they keep working. Limit 12,000 characters per file.
      - id: plugins
        output: .agents/plugin templates
        minLevel: full
        stability: preview
        risk: side-effecting
        docsUrl: https://antigravity.google/docs/plugin-management
        limit: Plugin management remains opt-in and is not emitted by default.

  codex:
    displayName: OpenAI Codex
    surfaces:
      - id: main-instructions
        output: AGENTS.md
        minLevel: basic
        stability: stable
        risk: passive
        docsUrl: https://developers.openai.com/codex/guides/agents-md
        limit: AGENTS.md is the first-class shared instruction file. Codex reads at most 32 KiB (project_doc_max_bytes) per run.
      - id: skills
        output: plugins/aicgen-sdlc/skills/*/SKILL.md
        minLevel: standard
        stability: stable
        risk: agentic
        docsUrl: https://developers.openai.com/codex/skills
        limit: Skill descriptions should stay narrow.
      - id: plugins
        output: plugins/aicgen-sdlc/plugin.json
        minLevel: standard
        stability: stable
        risk: agentic
        docsUrl: https://developers.openai.com/codex/plugins/build
        limit: Portable plugin.json is the entry point; .codex-plugin/plugin.json is kept as a supported compatibility manifest. Generated plugins are project-local; store publishing is out of scope.
      - id: hooks
        output: .codex/hooks.json
        minLevel: full
        stability: stable
        risk: side-effecting
        docsUrl: https://developers.openai.com/codex/hooks
        limit: Hooks require user trust review before they run. Do not use hooks to run full test suites; use /aicgen-check for validation.
      - id: mcp-templates
        output: .aicgen/mcp/codex.md
        minLevel: full
        stability: stable
        risk: side-effecting
        docsUrl: https://developers.openai.com/codex/mcp
        limit: AICGEN emits documentation templates only.
